<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTable</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/Project - Campus-Companion/CSS/dashboard.css">
    <link rel="stylesheet" href="/Project - Campus-Companion/CSS/timetable.css">
</head>
<body class="dashboard-page">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-logo">
                 <i class="fa-solid fa-graduation-cap" style="color: rgb(70, 48, 133);"></i>
                 <span>Campus Companion</span>
            </div>
            <nav>
                <button onclick="showPage('dashboard')" >
                    <i class="fa-solid fa-house-chimney" style="color: rgb(70, 48, 133);"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="showPage('timetable')" class="active">
                    <i class="fa-solid fa-calendar-days" style="color: rgb(70, 48, 133);"></i>
                    <span>TimeTable</span>
                </button>
                <button onclick="showPage('tasks')">
                    <i class="fa-solid fa-list-check" style="color: rgb(70, 48, 133);"></i>
                    <span>Tasks</span>
                </button>
                <button onclick="showPage('attendance')">
                    <i class="fa-solid fa-user-clock" style="color: rgb(70, 48, 133);"></i>
                    <span>Attendance</span>
                </button>
                <button onclick="showPage('cgpa-calculator')">
                    <i class="fa-solid fa-calculator" style="color: rgb(70, 48, 133);"></i>
                    <span>CGPA Calculator</span>
                </button>
                <button onclick="showPage('notes')">
                    <i class="fa-solid fa-file-pen" style="color: rgb(70, 48, 133);"></i>
                    <span>Notes</span>
                </button>
                <button onclick="showPage('profile')">
                    <i class="fa-regular fa-user" style="color: rgb(70, 48, 133);"></i>
                    <span>Profile</span>
                </button>
            </nav>
            <button class="logout" onclick="logoutBtn()">
                <i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(70, 48, 133);"></i>
                <span>Logout</span>
            </button>
        </aside>
        <section class="dashboard-content">
             <header class="dashboard-header">
                <button class="menu-btn">
                    <i class="fa-solid fa-bars" style="color: rgb(20, 20, 20);"></i>
                </button>
                <div class="dashboard-search">
                    <i class="fa-brands fa-sistrix" style="color: rgb(177, 151, 252);"></i>
                    <input type="text" id="dashboardSearch"
                    placeholder="Search Anything">
                </div>
                <div class="dashboard-actions">
                    <button class="theme-btn">
                        <i class="fa-solid fa-moon" style="color: rgb(20, 20, 20);"></i>
                    </button>
                    <button class="notification-btn">
                        <i class="fa-solid fa-bell" style="color: rgb(20, 20, 20);"></i>
                        <span class="notification-dot"></span>
                    </button>
                    <div class="user-info">
                        <span class="avatar">
                        <i class="fa-solid fa-circle-user" style="color: rgb(70, 48, 133);"></i>
                    </span>
                     <b id="topname">
                        Student
                     </b>
                    </div> 
                </div>
            </header>
            <main class="dashboard-main">
                <div class="welcome-section">
                     <h1>Timetable</h1> 
                </div> 
                 <div class="dashboard-card timetable-form-card"> 
                    <div class="card-header"> 
                        <h3>Add New Class</h3> 
                    </div> 
                    <div class="timetable-form"> 
                        <input type="text" id="subject" placeholder="Subject"> 
                        <input type="text" id="time" placeholder="Time"> 
                        <input type="text" id="room" placeholder="Room"> 
                        <select id="day"> 
                            <option value="">Select Day</option> 
                            <option value="Monday">Monday</option> 
                            <option value="Tuesday">Tuesday</option> 
                            <option value="Wednesday">Wednesday</option> 
                            <option value="Thursday">Thursday</option> 
                            <option value="Friday">Friday</option> 
                            <option value="Saturday">Saturday</option> 
                        </select> 
                        <button class="small-btn" onclick="addClassFromForm()"> 
                            <i class="fa-solid fa-plus" style="color: rgb(177, 151, 252);"></i>
                        </button> 
                    </div> 
                </div>
                <div class="dashboard-card">
                    <div class="card-header">
                         <h3>Class Schedule</h3> 
                    </div> 
                    <div class="timetable-header"> 
                        <div>Day</div> 
                        <div>Time</div> 
                        <div>Subject</div> 
                        <div>Room</div> 
                        <div>Action</div> 
                    </div> 
                    <div class="classes-list" id="timetableList"> 

                    </div> 
                </div> 
            </main> 
        </section> 
    </div>
    <script src="/Project - Campus-Companion/JS/dashboard.js"></script>
    <script src="/Project - Campus-Companion/JS/timetable.js"></script>
</html>
