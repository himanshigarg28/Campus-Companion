<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/STP-Campus-Companion/CSS/index_setup.css">
</head>
<body class="setup-page">
    <div class="setup-container">
        <div class="setup-logo">
            <i class="fa-solid fa-graduation-cap" style="color: rgb(70, 48, 133);"></i>
        </div>
        <h1>Campus Companion</h1>
        <p class="center">Your personal student productivity dashboard</p>
    
    <div class="divider">
        <h2>Let's set up your profile 👋</h2>
        <p class="center">Enter your basic details to personalize your dashboard.</p>
    </div>
    <form action="#" id="setupForm">
        <label> 
            <i class="fa-solid fa-user" style="color: rgb(70, 48, 133);"></i>
            Your Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        <label>
            <i class="fa-solid fa-house" style="color: rgb(70, 48, 133);"></i>
            Branch</label>
        <select id="branch">
            <option selected disabled>Select Branch</option>
            <option>CSE</option>
            <option>CSE-DS</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>
        <label>
            <i class="fa-regular fa-calendar" style="color: rgb(70, 48, 133);"></i>
            Semester</label>
        <select name="" id="semester">
            <option selected disabled>Select Semester</option>
            <option>I</option>
            <option>II</option>
            <option>III</option>
            <option>IV</option>
            <option>V</option>
            <option>VI</option>
            <option>VII</option>
            <option>VIII</option>
        </select>
        <button class="setupbtn" type="submit">Enter Campus Companion → </button>
    </form>
    </div>
    <script src="/STP-Campus-Companion/JS/index_setup.js"></script>
</body>
</html>
